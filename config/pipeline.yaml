# ===========================================================================
# config/pipeline.yaml  --  SINGLE SOURCE OF TRUTH for the OCBC POC pipeline
# ===========================================================================
# Everything that needs a deterministic name, a masking salt, a data-generator
# row-count range, or a data-quality rule reads it from THIS file. The Spark
# jobs read it via src/common/config_loader.py; the docs mirror it by hand.
# Terraform does NOT read this YAML -- it mirrors the same logical names as
# variables/locals (naming is deterministic from project + env, see design S2).
# ===========================================================================

# --- Deterministic base (design S2.1) -------------------------------------
# name_prefix = "{project}-{env}" = "ocbc-poc-dev" drives every resource name.
project: ocbc-poc
env: dev
region: us-east-1

# --- S3 buckets (design S2.2) ---------------------------------------------
# These are BASE names. The AWS account id is appended at Terraform / runtime
# so the globally-unique bucket becomes e.g. "ocbc-poc-dev-datalake-123456789012".
# One data-lake bucket holds every medallion layer as a prefix; one separate
# bucket holds Athena query results.
buckets:
  datalake: ocbc-poc-dev-datalake
  athena_results: ocbc-poc-dev-athena-results

# --- Allowed environments (design S6/S10) ---------------------------------
# The POC only ships "dev". Listing it here (instead of a tuple baked into the
# job argparse) lets a demo add an env WITHOUT editing job code -- the jobs read
# this list for their --env choices.
environments: [dev]

# --- Glue databases (design S2.3) -----------------------------------------
# One database per layer plus audit. Names use UNDERSCORES because Athena/Hive
# identifiers disallow hyphens. Landing is created for AC4 but the jobs write
# no managed tables into it (raw CSV/JSON only).
databases:
  landing: ocbc_poc_dev_landing
  bronze: ocbc_poc_dev_bronze
  silver: ocbc_poc_dev_silver
  canonical: ocbc_poc_dev_canonical
  gold: ocbc_poc_dev_gold
  audit: ocbc_poc_dev_audit

# --- PII masking (design S4) ----------------------------------------------
# national_id is tokenized with SHA-256 over (salt + value). The salt is fixed
# so the same customer always maps to the same token across runs (coherent
# demo). Precedence at runtime: env PIPELINE_MASK_SALT > this value > hard fail.
# A production system would use a KMS-backed key / tokenization vault instead.
masking:
  salt: ocbc-poc-demo-salt-2025
  # WHICH columns are masked and by WHICH method, per table (design S4). The
  # schema contract (column names/types/pii flags) stays in schema_defs.py; this
  # is only the what/how-to-mask POLICY, so a demo can retune it without code.
  # Method is one of: name | email | phone | pan | token | dob.
  columns:
    customers:
      first_name: name
      last_name: name
      email: email
      phone: phone
      national_id: token   # SHA-256 token; needs the salt above
      date_of_birth: dob    # generalized to birth_year (int)
    cards:
      card_number: pan
      cardholder_name: name

# --- Synthetic data generator (design S3 row counts, Finding 8) -----------
# Target row counts are declared ONCE here as [min, max] ranges and read by BOTH
# the generator and the local-check assertion, so the check is deterministic.
generator:
  row_counts:
    customers: [90, 110]      # ~100
    accounts: [140, 160]      # ~150 (>= 1 per customer, some customers 2)
    cards: [110, 130]         # ~120 (not every account has a card)
    transactions: [700, 900]  # ~800; largest fact table but still POC-tiny

# --- Reference data (single source of truth for code sets) ----------------
# These coded-value sets were previously declared TWICE (config dq_rules + the
# COUNTRIES/CURRENCIES tuples in data/generator/schema_defs.py). They now live
# ONCE here. The stdlib-only generator reads them with its narrow YAML scanner
# (no PyYAML); the DQ job and config_loader read them via PyYAML. Keep every
# entry a simple inline list of bare tokens on ONE line so the generator's
# scanner can parse it.
reference_data:
  countries:        [SG, US, MY, GB, IN, AU]       # customers.country
  currencies:       [SGD, USD, MYR, GBP, INR, AUD]  # accounts/transactions.currency
  account_types:    [SAVINGS, CHECKING, CREDIT]
  account_statuses: [ACTIVE, DORMANT, CLOSED]
  card_types:       [VISA, MASTERCARD, AMEX]
  card_statuses:    [ACTIVE, BLOCKED, EXPIRED]
  txn_types:        [DEBIT, CREDIT]

# --- Gold marts (declarative bits only -- design S6.4) --------------------
# ONLY the simple declarative metadata is config: the list of marts and each
# mart's lineage input tables. The Spark aggregation bodies (build_customer_360
# etc.) STAY in Python on purpose -- turning joins/aggregations into config would
# make the POC LESS simple (explicit non-goal).
gold_marts:
  customer_360:      { inputs: [customers, accounts, cards, transactions] }
  daily_txn_summary: { inputs: [transactions] }
  account_balances:  { inputs: [accounts, customers] }

# --- Data-quality rules (design S6.5) -------------------------------------
# One subtree per table. Every expectation carries an explicit `severity` so a
# demo can retune gating behaviour WITHOUT touching code. Severity is one of:
#   critical -> a failure HALTS the pipeline at the silver DQ gate
#   warn     -> a failure is recorded but the pipeline continues
#
# row_count>=1 severity policy (the "empty table" footgun, design S6.5):
#   - transactions: CRITICAL  (an empty fact table makes the gold marts useless)
#   - customers/accounts/cards: WARN (empty-but-valid is tolerated)
dq_rules:

  customers:
    # The allowed country set is NOT repeated here -- it lives ONCE in
    # reference_data.countries and the in_set rule below resolves it from there.
    expectations:
      - name: customer_id_not_null
        kind: not_null
        column: customer_id
        severity: critical
      - name: customer_id_unique
        kind: unique
        columns: [customer_id]
        severity: critical
      - name: email_not_null
        kind: not_null
        column: email
        severity: critical
      - name: country_in_set
        kind: in_set
        column: country
        severity: warn
      - name: row_count_min
        kind: row_count
        params: { min: 1 }
        severity: warn

  accounts:
    expectations:
      - name: account_id_unique
        kind: unique
        columns: [account_id]
        severity: critical
      - name: customer_id_referential
        kind: referential
        column: customer_id
        params: { ref_table: customers, ref_col: customer_id }
        severity: critical
      - name: balance_range
        kind: range
        column: balance
        params: { min: -10000 }
        severity: warn
      - name: status_in_set
        kind: in_set
        column: status   # allowed set resolved from reference_data.account_statuses
        severity: warn
      - name: row_count_min
        kind: row_count
        params: { min: 1 }
        severity: warn

  cards:
    expectations:
      - name: card_id_unique
        kind: unique
        columns: [card_id]
        severity: critical
      - name: account_id_referential
        kind: referential
        column: account_id
        params: { ref_table: accounts, ref_col: account_id }
        severity: critical
      - name: card_type_in_set
        kind: in_set
        column: card_type   # allowed set resolved from reference_data.card_types
        severity: warn
      - name: expiry_month_range
        kind: range
        column: expiry_month
        params: { min: 1, max: 12 }
        severity: warn
      - name: row_count_min
        kind: row_count
        params: { min: 1 }
        severity: warn

  transactions:
    expectations:
      - name: transaction_id_unique
        kind: unique
        columns: [transaction_id]
        severity: critical
      - name: account_id_referential
        kind: referential
        column: account_id
        params: { ref_table: accounts, ref_col: account_id }
        severity: critical
      - name: amount_range
        kind: range
        column: amount
        params: { min: -1000000, max: 1000000 }
        severity: warn
      - name: txn_type_in_set
        kind: in_set
        column: txn_type   # allowed set resolved from reference_data.txn_types
        severity: critical
      - name: row_count_min
        kind: row_count
        params: { min: 1 }
        severity: critical
